# abrp layer: self-built balenaOS without balenaCloud (public GHCR-based pipeline)
BBPATH =. "${LAYERDIR}:"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-abrp"
BBFILE_PATTERN_meta-abrp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-abrp = "99"

LAYERDEPENDS_meta-abrp = "core balena-common balena-kirkstone"
LAYERSERIES_COMPAT_meta-abrp = "kirkstone scarthgap"

# abrp: helios (core-next) image version for the supervisor composition.
# Global fallback; the authoritative pin lives in conf/samples/local.conf.sample
# (same convention as SUPERVISOR_VERSION). Used by the balena-supervisor and
# docker-disk bbappends.
HELIOS_VERSION ?= "0.25.28"

# abrp layer: self-built balenaOS without balenaCloud (public GHCR-based pipeline)
BBPATH =. "${LAYERDIR}:"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-abrp"
BBFILE_PATTERN_meta-abrp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-abrp = "99"

LAYERDEPENDS_meta-abrp = "core balena-common balena-kirkstone"
LAYERSERIES_COMPAT_meta-abrp = "kirkstone scarthgap"
